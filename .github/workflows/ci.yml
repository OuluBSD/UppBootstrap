name: UppBootstrap CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-posix:
    name: POSIX (${{ matrix.os }} - ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cxx: [clang++, g++]
        exclude:
          - os: macos-latest
            cxx: g++

    steps:
      - name: Checkout UppBootstrap
        uses: actions/checkout@v4

      - name: Checkout U++ Source (Upstream U++)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: upp-root
          sparse-checkout: |
            mkumk_blitz.cpp
            Makefile
            uppsrc/**
          sparse-checkout-cone-mode: false

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang g++ libbz2-dev libexpat1-dev libfontconfig1-dev libfreetype-dev liblz4-dev liblzma-dev libpcre2-dev libpng-dev libx11-dev libxcb1-dev libxxhash-dev libzstd-dev zlib1g-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpng lz4 pcre2 xxhash zstd xz bzip2

      - name: Compile and Run Bootstrap
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          ./bootstrap.sh --upp-root upp-root --verbose

      - name: Verify umk Execution
        run: |
          ./upp-root/bin/umk

  build-windows:
    name: Windows (${{ matrix.compiler }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc]

    steps:
      - name: Checkout UppBootstrap
        uses: actions/checkout@v4

      - name: Checkout U++ Source (Upstream U++)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: upp-root
          sparse-checkout: |
            mkumk_blitz.cpp
            Makefile
            uppsrc/**
          sparse-checkout-cone-mode: false

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run Windows Bootstrap
        shell: cmd
        run: |
          bootstrap.cmd --upp-root upp-root --verbose

      - name: Verify umk Execution
        shell: cmd
        run: |
          upp-root\bin\umk.exe
